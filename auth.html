<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кіру және Тіркелу — Менің Күнделігім</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">📖 Менің Күнделігім</a>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">Басты бет</a>
                <a href="diary.html">Күнделік</a>
                <a href="auth.html" class="btn-nav active">Кіру / Тіркелу</a>
            </nav>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-tabs">
                <button class="tab-btn active" id="loginTab">Кіру</button>
                <button class="tab-btn" id="registerTab">Тіркелу</button>
            </div>

            <!-- КІРУ ФОРМАСЫ -->
            <form id="loginForm" class="auth-form" action="diary.html" method="POST">
                <h2>Аккаунтқа кіру</h2>
                <div class="form-group">
                    <label for="loginEmail">Электрондық пошта</label>
                    <input type="email" id="loginEmail" name="email" placeholder="example@mail.kz" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Құпиясөз</label>
                    <input type="password" id="loginPassword" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Кіру</button>
            </form>

            <!-- ТІРКЕЛУ ФОРМАСЫ -->
            <form id="registerForm" class="auth-form hidden" action="diary.html" method="POST">
                <h2>Жаңа аккаунт ашу</h2>
                <div class="form-group">
                    <label for="regName">Аты-жөніңіз</label>
                    <input type="text" id="regName" name="username" placeholder="Айдана Серікқызы" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Электрондық пошта</label>
                    <input type="email" id="regEmail" name="email" placeholder="example@mail.kz" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Құпиясөз (кемінде 6 таңба)</label>
                    <input type="password" id="regPassword" name="password" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="regConfirm">Құпиясөзді растаңыз</label>
                    <input type="password" id="regConfirm" name="confirm_password" minlength="6" required>
                </div>
                <p id="authError" class="error-msg"></p>
                <button type="submit" class="btn btn-primary btn-full">Тіркелу</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Жеке Күнделік веб-қосымшасы.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
